project:
  type: website
  resources:
    - _redirects
    - assets/vendor
    - assets/js
  pre-render:
    - ruby scripts/generate_author_footer.rb
  post-render:
    - python3 scripts/localize_remote_assets.py

execute:
  freeze: auto

website:
  title: "Paul Simmering"
  site-url: "https://simmering.dev"
  search: true
  navbar:
    right:
      - about.qmd
      - text: Blog
        href: blog.qmd
      - publications.qmd
      - talks.qmd
      - projects.qmd
      - icon: github
        href: https://github.com/psimm
      - icon: linkedin
        href: https://www.linkedin.com/in/paulsimmering
  page-footer: |
    <a href="/blog.xml">Subscribe via RSS</a> | <a href="/imprint.html">Imprint</a> | <a href="/privacy.html">Privacy policy</a> | <a href="/ai.html">AI Notice</a><br>This website doesn't use cookies.<script data-goatcounter="https://simmering.goatcounter.com/count"
        async src="/assets/vendor/goatcounter/count.js"></script>
format:
  html:
    html-math-method:
      method: mathjax
      url: /assets/vendor/mathjax/tex-svg-full-3.2.2.js
    date-format: "YYYY-MM-DD"
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    css:
      - fonts.css
      - styles.css
    linkcolor: "#2563eb"
    highlight-style:
      light: custom-light.theme
      dark: custom-dark.theme
    code-overflow: wrap
    code-copy: hover
    code-block-border-left: "#64748b"
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    monofont: "JetBrains Mono, Consolas, monospace"
